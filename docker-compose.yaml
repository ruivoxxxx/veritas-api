services:
    api:
        build: .
        container_name: veritas-api
        restart: always
        ports:
            - '3000:3000'
        env_file:
            - .env
        depends_on:
            - postgres
        environment:
            DB_HOST: ${DB_HOST}
            DB_PORT: 5432
            DB_USER: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            Db_NAME: ${DB_NAME}
        networks:
            - app-network

    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGDATA: /data/postgres
        volumes:
            - postgres:/data/postgres
        ports:
            - '5432:5432'
        networks:
            - app-network
        restart: unless-stopped

    pgadmin:
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: ${DB_ADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
        ports:
            - '8081:80'
        depends_on:
            - postgres
        networks:
            - app-network
networks:
    app-network:
        driver: bridge

volumes:
    postgres:
